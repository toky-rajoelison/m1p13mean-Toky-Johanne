<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Mean Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" style="background-color:rgb(233, 233, 239)">
            <div class="brand">
                <div class="logo-icon">M</div>
                <span>PRIMER.</span>
            </div>
            
            <nav class="nav-list" >
                <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-wallet"></i> Payments</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-user-shield"></i> Admin</a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <div class="main-wrapper" >
            <header class="top-header" style="background-color:rgb(233, 233, 239)">
                <div class="search-box" style="background-color:rgb(255, 255, 255)">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search tasks, users...">
                </div>

                <div class="header-actions">
                    <div class="action-icon">
                        <i class="fa-solid fa-expand"></i>
                    </div>
                    <div class="notification">
                        <i class="fa-solid fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="profile">
                        <div class="profile-info">
                            <span class="user-name">Alex Rivera</span>
                            <span class="user-role">Administrator</span>
                        </div>
                        <img src="https://ui-avatars.com/api/?name=Alex+Rivera&background=00d1ff&color=fff" alt="Profile" class="avatar">
                    </div>
                </div>
            </header>

            <main class="content">
                <div class="welcome-banner">
                    <h1>Project Overview</h1>
                    <p>Welcome back! Here is what's happening with your projects today.</p>
                </div>

                <div class="grid-container">
                    <div class="main-card">
                        <h3>Main Interface</h3>
                        <p>This area remains clean and white for maximum readability.</p>
                    </div>
                </div>
            </main>

            <footer class="main-footer" style="background-color:rgb(61, 131, 32)">
                <p>&copy; 2026 Midnight Dashboard &bull; Version 1.0.2</p>
            </footer>
        </div>
    </div>

</body>
</html>
