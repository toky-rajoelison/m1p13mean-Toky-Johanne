<app-sidebar [sidebarCollapsed]="sidebarCollapsed"></app-sidebar>

    <div class="main-wrapper">
        <app-header></app-header>

        <main class="content">
<div class="avis-boutique-form">
  <h2>Laisser un avis pour la boutique</h2>
  <label>
    Note (1 à 10) :
    <input type="number" [(ngModel)]="note" min="1" max="10">
  </label>
  <br>

  <label>
    Commentaire :
    <textarea [(ngModel)]="commentaire" placeholder="Votre commentaire..."></textarea>
  </label>
  <br>

  <button (click)="envoyerAvis()" class="btn-create">Envoyer l'avis</button>

  <div *ngIf="message" style="margin-top: 10px; color: green;">
    {{ message }}
  </div>
</div>
</main>
        <app-footer></app-footer>
    </div>
