<div class="login-container">
  <h2>Login hi</h2>

  <form (ngSubmit)="onLogin()">
    <div>
      <label>Email</label>
      <input 
        type="email" 
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
      />
    </div>

    <div>
      <label>Password</label>
      <input 
        type="password" 
        placeholder="Password"
        [(ngModel)]="mot_de_passe"
        name="mot_de_passe"
      />
    </div>

    <button type="submit">Login</button>
    <div *ngIf="message" class="message">
    {{ message }}
    </div>
    <p>{{email}}</p>
    <p>{{mot_de_passe}}</p>
  </form>
</div>
