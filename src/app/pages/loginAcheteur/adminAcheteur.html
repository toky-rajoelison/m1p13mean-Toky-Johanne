<div class="login-container">
  <div class="brand">
    <div class="logo-icon">
      <i class="fa-solid fa-users-cog"></i>
    </div>
    <span>EcomManage</span>
  </div>

  <div class="login-card">
    <h2>LOGIN ADMIN_ACHETEUR</h2>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          placeholder="acheteur1@gmail.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          placeholder="1"
          [(ngModel)]="mot_de_passe"
          name="mot_de_passe"
          required
        />
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div *ngIf="message" class="message">
        {{ message }}
      </div>
    </form>
  </div>
</div>
